<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CBL Admin</title><link rel="stylesheet" href="style.css"><style>.admin{max-width:1000px;margin:45px auto;padding:0 18px}.box{background:#151515;border:1px solid #333;padding:22px;margin:18px 0}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form input,.form textarea,.form select{width:100%;padding:13px;background:#090909;color:white;border:1px solid #444;font:inherit}.form textarea{min-height:90px;grid-column:1/-1}.form label{font-size:12px;color:#bbb}.form button,.action{padding:13px 16px;background:#e52b32;border:0;color:white;font-weight:bold;cursor:pointer}.wide{grid-column:1/-1}.items{display:grid;gap:10px}.item{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid #333}.item img{width:65px;height:75px;object-fit:cover}.item div{flex:1}.item button{margin:3px;padding:8px;background:#292929;color:white;border:1px solid #555}.status{color:#aaa;font-size:12px}@media(max-width:600px){.form{grid-template-columns:1fr}.form textarea,.wide{grid-column:auto}.item{align-items:flex-start}.item button{font-size:11px}}</style></head><body><header class="top"><a class="brand" href="/"><img src="assets/logo-cbl.png" alt="CBL"><span>CBL <i>ADMIN</i></span></a><nav><a href="/">VER LOJA ↗</a></nav></header><main class="admin"><p class="eyebrow">PAINEL PRIVADO</p><h1 style="font-family:'Archivo Black';font-size:clamp(38px,8vw,64px)">GERENCIAR PEÇAS<span style="color:#e52b32">.</span></h1><section id="login" class="box"><h2>Entrar no painel</h2><form id="loginForm" class="form"><label class="wide">E-mail<input id="email" type="email" required autocomplete="username"></label><label class="wide">Senha<input id="password" type="password" required autocomplete="current-password"></label><button class="wide">ENTRAR</button></form><p class="status">Use o usuário que você criou em Authentication → Users no Supabase.</p></section><section id="panel" class="hidden"><div class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 id="formTitle">Adicionar peça</h2><button id="logout" class="action">SAIR</button></div><form id="productForm" class="form"><input id="pid" type="hidden"><label>Nome da peça<input id="name" required maxlength="100"></label><label>Preço (R$)<input id="price" type="number" min="0" step="0.01" placeholder="Ex.: 59,90"></label><label>Tamanho<input id="size" placeholder="Ex.: M, 40, G"></label><label>Categoria<input id="category" placeholder="Camiseta, calça..."></label><label>Condição<select id="condition"><option>Usado — ótimo estado</option><option>Usado — bom estado</option><option>Novo</option></select></label><label>Status<select id="status"><option value="draft">Rascunho</option><option value="published">Publicado</option><option value="sold">Vendido</option></select></label><label class="wide">Medidas<input id="measurements" placeholder="Ex.: comprimento 70 cm; largura 54 cm"></label><label class="wide">Descrição<textarea id="description"></textarea></label><label class="wide">Foto da peça<input id="photo" type="file" accept="image/*"></label><button class="wide">SALVAR PEÇA</button><button type="button" id="reset" class="wide" style="background:#333">LIMPAR FORMULÁRIO</button></form><p id="msg" class="status" role="status"></p></div><div class="box"><h2>Seu catálogo</h2><div id="list" class="items">Carregando…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
